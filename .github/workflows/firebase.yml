name: Test och publicering

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Varje natt: bygg om och publicera, så att sidans HTML (för sökmotorer, delningar och besökare
  # utan JavaScript) får med det som administratörerna har ändrat i årets lopp, resultatarkivet och partnerna.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tester (säkerhetsregler och ände-till-ände)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4 # Firestore- och Storage-emulatorerna kräver Java
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:rules
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-skarmdumpar
          path: tests/out
          if-no-files-found: ignore

  preview:
    name: Förhandsversion för pull request
    needs: test
    if: github.event_name == 'pull_request' && vars.VITE_FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env: # Webbkonfigurationen för Firebase (repository variables). Inte i testjobbet: där gäller .env.emulator.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }} # tom = uppladdning av bilder är avstängd
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          expires: 7d

  deploy:
    name: Publicera renrajden.se
    needs: test
    # Publicerar vid push till main, varje natt, eller manuellt via Actions → "Run workflow" på main.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && vars.VITE_FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env: # Webbkonfigurationen för Firebase (repository variables). Inte i testjobbet: där gäller .env.emulator.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }} # tom = uppladdning av bilder är avstängd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reglerna först: bygget läser årets lopp, resultatarkivet och partnerna från Firestore och behöver de nya reglerna.
      # Reglerna för Storage (bilder och filmer) publiceras först när VITE_FIREBASE_STORAGE_BUCKET finns,
      # alltså när Storage är påslaget i projektet (docs/driftsattning.md, steg 10). Hinken anges då direkt
      # i en kopia av firebase.json. Annars slår verktyget upp projektets standardhink, och det får
      # servicekontot inte göra. firebase.json behåller den enkla formen, som emulatorn behöver.
      - name: Publicera säkerhetsregler för Firestore och Storage
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          ONLY="firestore:rules"
          CONFIG="firebase.json"
          if [ -n "$VITE_FIREBASE_STORAGE_BUCKET" ]; then
            node -e 'const fs = require("fs"); const c = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
              c.storage = [{ bucket: process.env.VITE_FIREBASE_STORAGE_BUCKET, rules: "storage.rules" }];
              fs.writeFileSync("firebase.deploy.json", JSON.stringify(c, null, 2));'
            ONLY="firestore:rules,storage"
            CONFIG="firebase.deploy.json"
          fi
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --config "$CONFIG" --only "$ONLY" --project "$VITE_FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json" firebase.deploy.json
      - name: Bygg (med innehållet från Firestore)
        env:
          CMS_REQUIRE_FIRESTORE: "true" # avbryt hellre än att publicera gammalt innehåll
        run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
